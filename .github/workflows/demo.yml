name: Drive HeyClicky demo (audio)

# Signs the app in (token callback, same as signin.yml), waits for the
# post-sign-in survey, then posts a synthetic mouse click at a given coordinate
# with cliclick (which uses CGEventPost and does not need Accessibility to POST
# events), and screenshots the result. Coordinates are in the 1024x768 capture
# space. Manual trigger.

on:
  workflow_dispatch:
    inputs:
      clicks:
        description: "Semicolon-separated x,y clicks in 1024x768 space, applied in order"
        default: "517,486;483,421"
      dmg_url:
        description: "Direct .dmg URL (blank = Sparkle appcast)"
        required: false
        default: ""

jobs:
  interact:
    runs-on: macos-latest
    timeout-minutes: 45   # the full guided demo (video + 9-step tutorial) is long
    steps:
      - name: Environment
        run: |
          sw_vers; uname -m

      - name: Install cliclick
        run: brew install --quiet cliclick || brew install cliclick || true

      - name: Install audio tooling (do NOT change default device yet)
        run: |
          set -x
          brew install --quiet coreutils || brew install coreutils || true          # gtimeout
          brew install --quiet ffmpeg || brew install ffmpeg || true                 # stitch frames
          brew install --quiet switchaudio-osx || brew install switchaudio-osx || true
          brew install --quiet blackhole-2ch || brew install --cask blackhole-2ch || true
          # Register the new HAL device with a single coreaudiod restart NOW, well
          # before the app launches, so the restart never races the app's audio
          # init (that race broke auth). Crucially we leave the DEFAULT input/output
          # untouched here, so the app launches + authenticates on the normal
          # device; we only switch to BlackHole later, at the mic step.
          sudo killall coreaudiod 2>/dev/null || true
          sleep 5
          echo "--- audio devices ---"; SwitchAudioSource -a || true
          # ---- Disable the macOS "press Control twice" Dictation shortcut ----
          # Control-twice is HeyClicky's text trigger, but macOS claims it for
          # Dictation and pops a system prompt that steals the gesture. Turn the
          # OS dictation shortcut/feature off (before the app launches) so the
          # Control-twice reaches HeyClicky instead.
          defaults write com.apple.HIToolbox AppleDictationAutoEnable -bool false 2>/dev/null || true
          defaults write com.apple.assistant.support "Dictation Enabled" -bool false 2>/dev/null || true
          defaults write com.apple.speech.recognition.AppleSpeechRecognition.prefs DictationIMMasterDictationEnabled -bool false 2>/dev/null || true
          # Dictation "key identifier" 0 = no double-press shortcut.
          defaults write com.apple.HIToolbox AppleDictationKeyIdentifier -int 0 2>/dev/null || true
          killall cfprefsd 2>/dev/null || true
          # One clip per demo step's spoken interaction.
          say -o "$HOME/clip.aiff"    "Testing, testing, one two three. Hey Clicky, can you hear me now?" || true
          say -o "$HOME/name.aiff"    "Hi, my name is Yohoji." || true
          say -o "$HOME/draw.aiff"    "Find and draw something interesting on my screen." || true
          say -o "$HOME/circle.aiff"  "What is this thing I circled? Tell me about it." || true
          say -o "$HOME/dictate.aiff" "This is a dictation test. Please type this sentence out for me." || true
          ls -l "$HOME"/*.aiff || true

      - name: Fetch the app
        run: |
          set -euo pipefail
          URL="${{ github.event.inputs.dmg_url }}"
          if [ -z "$URL" ]; then
            # PIN to 1.0.48 — the exact build our decompilation (hc_arm64.macho)
            # is from. The appcast's first entry is now 1.0.50, and Sparkle would
            # otherwise auto-update mid-run, changing behavior/offsets from what we
            # analyzed. Never take "latest".
            URL="https://github.com/farzaa/clicky-releases/releases/download/v1.0.48/HeyClicky.dmg"
          fi
          echo "fetching pinned build: $URL"
          curl -fL "$URL" -o HeyClicky.dmg
          MP=$(mktemp -d); hdiutil attach HeyClicky.dmg -nobrowse -mountpoint "$MP"
          cp -R "$(find "$MP" -maxdepth 1 -name '*.app' | head -1)" "$HOME/HeyClicky.app"
          hdiutil detach "$MP" || true
          xattr -dr com.apple.quarantine "$HOME/HeyClicky.app" || true
          echo "=== bundle version (must be 1.0.48) ==="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$HOME/HeyClicky.app/Contents/Info.plist" 2>/dev/null || \
            defaults read "$HOME/HeyClicky.app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || true

      - name: Launch, sign in, drive to Allow, observe
        env:
          AT: ${{ secrets.CLICKY_ACCESS_TOKEN }}
          RT: ${{ secrets.CLICKY_REFRESH_TOKEN }}
        run: |
          set -x
          [ -n "$AT" ] && [ -n "$RT" ] || { echo "Missing token secrets"; exit 1; }
          mkdir -p evidence/shots
          # Vision helper (Swift, so no pip — macOS runners use an externally
          # managed Python that rejects pip installs). The onboarding card renders
          # at a different position on every launch, so fixed coords miss. We
          # locate the target in a fresh screenshot each time. "blue" finds the
          # accent-blue dot or button (the only saturated blue on a black screen,
          # dock/menubar excluded); "allow" finds the light macOS TCC dialog and
          # returns its bottom-right button. Output is X,Y in 1024x768 space.
          cat > /tmp/find_target.swift <<'SW'
          import AppKit
          import Foundation
          let a = CommandLine.arguments
          guard a.count >= 3, let img = NSImage(contentsOfFile: a[1]) else { print("NONE"); exit(0) }
          let mode = a[2]
          var pr = NSRect(x: 0, y: 0, width: img.size.width, height: img.size.height)
          guard let cg = img.cgImage(forProposedRect: &pr, context: nil, hints: nil) else { print("NONE"); exit(0) }
          let rep = NSBitmapImageRep(cgImage: cg)
          let W = rep.pixelsWide, H = rep.pixelsHigh
          guard let data = rep.bitmapData else { print("NONE"); exit(0) }
          let spp = rep.samplesPerPixel, bpr = rep.bytesPerRow
          let sx = 1024.0 / Double(W), sy = 768.0 / Double(H)
          func rgb(_ x: Int, _ y: Int) -> (Int, Int, Int) {
            let o = y * bpr + x * spp
            return (Int(data[o]), Int(data[o + 1]), Int(data[o + 2]))
          }
          // Collect light (system-dialog) pixels and accent-blue pixels in one pass.
          var lx = [Int](); var ly = [Int]()      // light dialog
          var bx = [Int](); var by = [Int]()      // accent blue (buttons/dots)
          let yl0 = Int(Double(H) * 0.05), yl1 = Int(Double(H) * 0.85)   // dialog band
          let yb0 = Int(Double(H) * 0.10), yb1 = Int(Double(H) * 0.88)   // button band (skip notch)
          var y = yl0
          while y < yb1 {
            var x = 0
            while x < W {
              let (r, g, b) = rgb(x, y)
              if y >= yl0 && y < yl1 && r > 205 && g > 205 && b > 205 { lx.append(x); ly.append(y) }
              if y >= yb0 && y < yb1 && b > 140 && b > r + 50 && b > g + 30 && r < 120 { bx.append(x); by.append(y) }
              x += 2
            }
            y += 2
          }
          func fmt(_ cx: Double, _ cy: Double) -> String { "\(Int((cx * sx).rounded())),\(Int((cy * sy).rounded()))" }
          func blueTarget() -> String? {
            if bx.count < 25 { return nil }
            let band = Int(Double(H) * 0.05); let ymax = by.max() ?? 0
            var cbx = [Int](); var cby = [Int]()
            for i in 0..<by.count where by[i] >= ymax - band { cbx.append(bx[i]); cby.append(by[i]) }
            return fmt(Double(cbx.reduce(0, +)) / Double(cbx.count), Double(cby.reduce(0, +)) / Double(cby.count))
          }
          // Light-region bbox (as fractions of the screen). Used to tell a small
          // centred TCC dialog from a big browser page (Safari during the tutorial).
          func lightBox() -> (Double, Double, Double, Double, Double, Double)? {
            if lx.count < 800 { return nil }
            let sxs = lx.sorted(), sys2 = ly.sorted()
            func pct(_ arr: [Int], _ p: Double) -> Double { Double(arr[Int(Double(arr.count) * p)]) }
            let xlo = pct(sxs, 0.05), xhi = pct(sxs, 0.95), ylo = pct(sys2, 0.05), yhi = pct(sys2, 0.95)
            return (xlo, xhi, ylo, yhi, (xhi - xlo) / Double(W), (yhi - ylo) / Double(H))
          }
          func dialogTarget(_ minC: Int) -> String? {
            guard lx.count >= minC, let (xlo, xhi, ylo, yhi, wf, hf) = lightBox() else { return nil }
            if wf > 0.45 || hf > 0.60 { return nil }   // too big to be a dialog (browser)
            let cxf = (xlo + xhi) / 2.0 / Double(W)
            if cxf < 0.35 || cxf > 0.65 { return nil } // off-centre => a macOS notification banner, not a TCC prompt
            return fmt(xlo + 0.73 * (xhi - xlo), ylo + 0.86 * (yhi - ylo))   // Allow: right-of-centre, near bottom
          }
          switch mode {
          case "blue":  print(blueTarget() ?? "NONE")
          case "allow": print(dialogTarget(800) ?? "NONE")
          default:      // "classify": what is on screen + where to click
            // A big light region = Safari/browser page => the tutorial has started
            // => onboarding is done. Report it so the driver stops onboarding.
            if let (_, _, _, _, wf, hf) = lightBox(), wf > 0.45 || hf > 0.60 { print("browser") }
            else if let d = dialogTarget(1500) { print("dialog \(d)") }
            else if let b = blueTarget()  { print("blue \(b)") }
            else { print("none") }
          }
          SW
          # ---- Pre-grant Accessibility with a real csreq, before launch ------
          # A bare TCC row (csreq NULL) is inert: tccd verifies the requesting
          # app's signature against the stored csreq blob, so a signed app is not
          # trusted without it. Compute HeyClicky's designated requirement, turn
          # it into the binary csreq blob, and inject the Accessibility row WITH
          # that blob before first launch so AXIsProcessTrusted reads true when
          # the app checks it. (User approved this TCC write on a throwaway VM.)
          BID=com.humansongs.clicky
          SYS="/Library/Application Support/com.apple.TCC/TCC.db"
          : > evidence/tcc_write.log
          REQ=$(codesign -d -r- "$HOME/HeyClicky.app" 2>&1 | sed -n 's/^designated => //p')
          echo "designated requirement: $REQ" | tee -a evidence/tcc_write.log
          CSHEX=""
          if [ -n "$REQ" ]; then
            printf '%s' "$REQ" | csreq -r- -b /tmp/req.csreq 2>>evidence/tcc_write.log \
              && CSHEX=$(xxd -p /tmp/req.csreq | tr -d '\n')
          fi
          echo "csreq blob hex length: ${#CSHEX}" | tee -a evidence/tcc_write.log
          if [ -n "$CSHEX" ]; then
            # Accessibility is needed just to reach the Screen Recording screen
            # (each runner starts with an empty TCC.db); ScreenCapture is the one
            # we're actually testing — grant it before launch so the app reads it
            # at startup (Screen Recording is otherwise cached until relaunch).
            for SVC in kTCCServiceAccessibility kTCCServiceScreenCapture; do
              sudo sqlite3 "$SYS" \
                "INSERT OR REPLACE INTO access (service,client,client_type,auth_value,auth_reason,auth_version,csreq,flags) VALUES ('$SVC','$BID',0,2,4,1,X'$CSHEX',0);" \
                >>evidence/tcc_write.log 2>&1 && echo "$SVC INSERT OK (with csreq)" | tee -a evidence/tcc_write.log \
                || echo "$SVC INSERT FAILED" | tee -a evidence/tcc_write.log
            done
          else
            echo "no csreq blob; skipping csreq-based insert" | tee -a evidence/tcc_write.log
          fi
          sudo sqlite3 "$SYS" "SELECT service,client,auth_value,length(csreq) FROM access WHERE client='$BID';" | tee -a evidence/tcc_write.log
          sudo killall tccd 2>/dev/null || true
          sleep 3
          # ---- FULL-RUN screen recording (frame burst) ---------------------
          # Record the ENTIRE run by bursting screenshots (screencapture -x can
          # never wedge, unlike screencapture -V which hung on the audio device).
          # Stitched into an mp4 with ffmpeg at the end.
          TO=$(command -v gtimeout || command -v timeout || true)
          run_to() { if [ -n "$TO" ]; then "$TO" "$@"; else shift; "$@"; fi; }
          mkdir -p /tmp/frames
          ( fi=0; while :; do fi=$((fi+1)); screencapture -x "$(printf /tmp/frames/f_%05d.png "$fi")" 2>/dev/null; sleep 1; done ) &
          FULLVID=$!
          # ALSO record a real-time screen+AUDIO capture (ffmpeg avfoundation) so we
          # can HEAR the app speak. Audio comes from BlackHole (where the app's TTS
          # and the fed clip both play). May be black if ffmpeg lacks Screen
          # Recording; the frame burst above is the reliable video-only fallback.
          echo "--- avfoundation devices ---"; ffmpeg -hide_banner -f avfoundation -list_devices true -i "" 2>&1 | grep -iE "screen|blackhole" || true
          # Record to .mkv: Matroska stays playable even if the recorder is cut
          # off (mp4 needs a clean finalize for its moov atom, which SIGKILL broke).
          ffmpeg -nostdin -y -f avfoundation -capture_cursor 1 -framerate 12 \
            -i "Capture screen 0:BlackHole 2ch" -t 2400 -pix_fmt yuv420p \
            -c:v libx264 -preset ultrafast -c:a aac \
            evidence/av.mkv > evidence/av.log 2>&1 &
          AVVID=$!
          # ---- Onboarding: DO the full guided demo (no bypass) -------------
          # We deliberately do NOT set hasCompletedOnboarding / skipOnboardingVideo:
          # the user wants the real guided demo to play — the intro video's synced
          # auto-demo (research SpaceX competitors -> open the Starship page -> type
          # "what does this do?" -> prefill an email draft) and the interactive
          # tutorial (mic -> speaker -> voice -> draw -> circle -> TEXT MODE ->
          # email -> dictation -> finale). An OCR-driven driver below reads the
          # notch prompt each step and performs the right action.
          # DISABLE Sparkle auto-update so the pinned 1.0.48 build cannot silently
          # update to 1.0.50 mid-run (which would diverge from our decompilation).
          defaults write com.humansongs.clicky SUEnableAutomaticChecks -bool false 2>/dev/null || true
          defaults write com.humansongs.clicky SUAutomaticallyUpdate -bool false 2>/dev/null || true
          defaults write com.humansongs.clicky SUScheduledCheckInterval -int 0 2>/dev/null || true
          defaults write com.humansongs.clicky SUHasLaunchedBefore -bool true 2>/dev/null || true
          # Explicitly BIND the text trigger to a clean control double-tap before
          # launch (its default may be unset, which would leave the fire-gate at
          # offset 0x2b == 0). Shortcut schema recovered from the binary:
          # {"triggerKind":"doubleTapModifier","keyCode":N,"modifierMaskRawValue":M}
          # control keycode = 59, control mask = 0x40000 = 262144. The value is a
          # JSON Data blob (same shape as the persisted handsFreeDictation key).
          mkdir -p "$HOME/Library/Preferences"
          python3 - <<'PY' || true
          import plistlib, os
          p = os.path.expanduser('~/Library/Preferences/com.humansongs.clicky.plist')
          try:
              d = plistlib.load(open(p, 'rb'))
          except Exception:
              d = {}
          d['clicky.hotkeys.textTrigger.v1'] = b'{"triggerKind":"doubleTapModifier","keyCode":59,"modifierMaskRawValue":262144}'
          plistlib.dump(d, open(p, 'wb'))
          print('pre-seeded textTrigger.v1 =', d['clicky.hotkeys.textTrigger.v1'])
          PY
          killall cfprefsd 2>/dev/null || true
          open "$HOME/HeyClicky.app"
          sleep 18
          { set +x; } 2>/dev/null
          open "clicky://auth-callback#access_token=${AT}&refresh_token=${RT}&expires_in=3600&token_type=bearer"
          set -x
          # AUTH GATE: do not click until the injected session has actually signed
          # the app in. Otherwise the first clicks land on the "Sign in with
          # Google" button, the app opens browser OAuth, and onboarding derails.
          # Poll the app's own log for the authenticated marker before proceeding.
          echo "waiting for authentication to take effect before clicking..."
          # Cheap, bounded gate: 'log show --last 40s' (no --info) is fast; cap at
          # ~90s so a failed auth can't eat the job budget and get us cancelled.
          AUTHED=0
          for i in $(seq 1 30); do
            if log show --predicate 'subsystem == "com.humansongs.clicky"' --last 40s 2>/dev/null | grep -q "Authenticated as"; then
              echo "auth confirmed after ~$((i*3))s"; AUTHED=1; break
            fi
            sleep 3
          done
          [ "$AUTHED" = 1 ] || echo "WARN: auth marker not seen; proceeding anyway"
          sleep 12   # let the post-sign-in survey render and settle
          screencapture -x evidence/shots/00-start.png 2>/dev/null || true
          # ---- STATE-AWARE onboarding driver ------------------------------
          # Instead of a rigid step sequence (which desynced when a screen — e.g.
          # the mic prompt — appeared late and got skipped, leaving it unclicked),
          # loop: look at what is ACTUALLY on screen and act.
          #   dialog -> click its Allow button (handles the mic + bypass prompts
          #             WHENEVER they appear, no timing assumption)
          #   blue   -> click the blue button/dot (color pick, Give me a home,
          #             Let's start, Grant Microphone, Grant Access, Meet HeyClicky)
          #   none   -> early: it's the survey (no blue button) -> click "Claude";
          #             late (after we have advanced): the tutorial has started ->
          #             onboarding is done.
          # This self-recovers: a late dialog is simply clicked on a later loop.
          advanced=0
          noneStreak=0
          lastXY=""
          for i in $(seq 1 80); do
            screencapture -x /tmp/cur.png 2>/dev/null || true
            R=$(swift /tmp/find_target.swift /tmp/cur.png classify 2>/dev/null || echo none)
            MODE="${R%% *}"; XY="${R#* }"
            echo "onboard iter $i: $R"
            done_onboard=0
            case "$MODE" in
              browser)
                # Safari is open => the intro tutorial has started => onboarding
                # is finished. (Only trust this once we've actually advanced.)
                [ "$advanced" -ge 5 ] && done_onboard=1 ;;
              dialog)
                cliclick c:${XY%,*},${XY#*,} || true
                advanced=$((advanced+1)); noneStreak=0 ;;
              blue)
                # avoid hammering the exact same spot forever (stuck) — still click,
                # but count repeats toward the done heuristic.
                cliclick c:${XY%,*},${XY#*,} || true
                [ "$XY" = "$lastXY" ] && noneStreak=$((noneStreak+1)) || { advanced=$((advanced+1)); noneStreak=0; }
                lastXY="$XY" ;;
              *)
                noneStreak=$((noneStreak+1))
                if [ "$advanced" -lt 3 ]; then
                  cliclick c:517,486 || true          # survey: pick "Claude"
                fi ;;
            esac
            screencapture -x "evidence/shots/onboard-$(printf %02d "$i").png" 2>/dev/null || true
            # Complete onboarding by SCREEN STATE, not a click-count budget. The old
            # `advanced>=8` cap broke the loop one iteration too early: it clicked
            # "Allow" on the screen-recording TCC dialog and stopped, never looping
            # back to re-click "Grant Access" so the app could re-verify and advance
            # to the next screen — leaving it frozen on "Complete screen access".
            # Now: only stop on a real done signal. Whenever a blue button or a
            # dialog is on screen there is still work to do, so keep going and let
            # the permission screens (Grant Access -> Allow -> re-verify) resolve.
            # done = Safari/tutorial opened (browser, once advanced), or the card
            # has been quiet (mode none) for several straight iterations after we
            # have clearly progressed. The 80-iter x ~5s cap (~6.5m) is the backstop.
            if [ "$done_onboard" = 1 ] || { [ "$advanced" -ge 6 ] && [ "$noneStreak" -ge 4 ]; }; then
              echo "onboarding complete after $i iters (advanced=$advanced, mode=$MODE)"; break
            fi
            sleep 4
          done
          # After the mic Allow the app checks Accessibility. Because we
          # pre-granted it (with csreq) before launch, a working grant means the
          # app skips the Accessibility screen and lands on Screen Recording
          # (permission 3 of 3) on its own. Observe which screen we end on.
          echo "--- tcc_write.log ---"; cat evidence/tcc_write.log
          # ---- DO THE FULL GUIDED DEMO (OCR-driven, robust) ----------------
          # The app gates everything on onboarding COMPLETING. We drive the REAL
          # demo (no skip): (1) click "Meet HeyClicky"; (2) let the intro video's
          # synced auto-demo play — HeyClicky researches SpaceX competitors, opens
          # the Starship page, types "what does this do?", drafts an email; (3)
          # walk the interactive tutorial (mic -> speaker -> voice -> draw ->
          # circle -> TEXT MODE -> email -> dictation -> finale). We read the notch
          # prompt each step with on-device Vision OCR and perform the right action.
          app_state() { log show --predicate 'subsystem == "com.humansongs.clicky"' --last 25s 2>/dev/null | grep -oE 'reason=[A-Za-z]+' | tail -1; }
          # Vision OCR helper: print all text it recognises in a screenshot.
          cat > /tmp/ocr.swift <<'SWIFT'
          import Foundation
          import AppKit
          import Vision
          guard CommandLine.arguments.count > 1,
                let img = NSImage(contentsOfFile: CommandLine.arguments[1]),
                let cg = img.cgImage(forProposedRect: nil, context: nil, hints: nil) else { exit(0) }
          let req = VNRecognizeTextRequest { r, _ in
            (r.results as? [VNRecognizedTextObservation])?.forEach { o in
              if let t = o.topCandidates(1).first { print(t.string) }
            }
          }
          req.recognitionLevel = .accurate
          req.usesLanguageCorrection = true
          try? VNImageRequestHandler(cgImage: cg, options: [:]).perform([req])
          SWIFT
          # Pre-compile once (recompiling per call would add ~3s x 100 calls).
          swiftc /tmp/ocr.swift -o /tmp/ocr 2>/dev/null || true
          ocr() { screencapture -x /tmp/ocr.png 2>/dev/null; { /tmp/ocr /tmp/ocr.png 2>/dev/null || swift /tmp/ocr.swift /tmp/ocr.png 2>/dev/null; } | tr '\n' ' '; }
          # Keyboard emitter (CGEvent flagsChanged) — used for the voice/draw HOLDS
          # (mode "hold" = control+option held ~3.5s, proven to fire reason=ptt).
          cat > /tmp/keys.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let src = CGEventSource(stateID: .hidSystemState)
          func flags(_ f: CGEventFlags, _ key: CGKeyCode, _ down: Bool) {
              guard let e = CGEvent(keyboardEventSource: src, virtualKey: key, keyDown: down) else { return }
              e.type = .flagsChanged; e.flags = f; e.post(tap: .cghidEventTap)
          }
          func ctrlTap(_ holdMs: UInt32) { flags(.maskControl, 0x3B, true); usleep(holdMs * 1000); flags([], 0x3B, false) }
          let args = Array(CommandLine.arguments.dropFirst())
          switch args.first ?? "double" {
          case "double":
              let holdMs = UInt32(args.count > 1 ? args[1] : "") ?? 120
              let gapMs  = UInt32(args.count > 2 ? args[2] : "") ?? 220
              flags([], 0x3B, false); usleep(90_000)
              ctrlTap(holdMs); usleep(gapMs * 1000); ctrlTap(holdMs)
          case "hold":
              flags(.maskControl, 0x3B, true); usleep(60_000)
              flags([.maskControl, .maskAlternate], 0x3A, true); usleep(3_500_000)
              flags(.maskControl, 0x3A, false); usleep(60_000); flags([], 0x3B, false)
          default: break
          }
          SWIFT
          # Continuous audio for the mic / speaker / voice / dictation steps.
          SwitchAudioSource -t input  -s "BlackHole 2ch" || true
          SwitchAudioSource -t output -s "BlackHole 2ch" || true
          ( while :; do SwitchAudioSource -t input -s "BlackHole 2ch" >/dev/null 2>&1; afplay "$HOME/clip.aiff" >/dev/null 2>&1 || true; done ) & AUD=$!
          # Synthesis helpers. Voice/draw HOLDS use the CGEvent path (proven to fire
          # reason=ptt); the double-tap uses System Events (the ONLY path that opens
          # the composer). keys.swift hold = control+option held ~3.5s.
          voice_hold() { swift /tmp/keys.swift hold >/dev/null 2>&1 || true; }
          ctrl_double() { osascript -e 'tell application "System Events"' -e 'key code 59' -e 'delay 0.12' -e 'key code 59' -e 'end tell' 2>/dev/null || true; }
          se_type()   { osascript -e "tell application \"System Events\" to keystroke \"$1\"" 2>/dev/null || true; }
          se_return() { osascript -e 'tell application "System Events" to key code 36' 2>/dev/null || true; }
          notch_continue() { cliclick c:511,86 || true; sleep 1; cliclick c:511,143 || true; sleep 1; cliclick c:511,611 || true; }

          # 1) Start the demo: click "Meet HeyClicky" until the intro/video/tutorial begins.
          echo "clicking 'Meet HeyClicky' to start the guided demo..."
          for k in 1 2 3 4 5 6; do
            cliclick c:511,143 || true; sleep 3
            st=$(app_state); echo "meet-heyclicky $k -> '$st'"
            case "$st" in *ntroActive*|*ideoActive*|*utorial*) break;; esac
          done
          screencapture -x evidence/shots/demo-00-intro-start.png 2>/dev/null || true

          # 2) Let the intro video + synced AUTO-DEMO play (DON'T skip). Record it.
          echo "letting the intro auto-demo play (SpaceX research / Starship / email draft)..."
          for i in $(seq 1 45); do    # up to ~4.5 min of video+demo
            st=$(app_state); T="$(ocr)"
            echo "demo-video iter $i: state='$st' ocr='${T:0:120}'"
            screencapture -x "evidence/shots/demo-video-$(printf %02d "$i").png" 2>/dev/null || true
            case "$st" in
              *utorial*|*ostOnboarding*|*uietPeriod*|"") echo "video done -> tutorial/live"; break;;
            esac
            sleep 6
          done

          # 3) Drive the interactive tutorial by reading the notch prompt (OCR).
          echo "walking the interactive tutorial step by step..."
          DONE=0
          for i in $(seq 1 70); do    # ~8 min backstop
            st=$(app_state); T="$(ocr)"; Tl=$(printf '%s' "$T" | tr 'A-Z' 'a-z')
            echo "tutorial iter $i: state='$st' ocr='${T:0:140}'"
            screencapture -x "evidence/shots/tut-$(printf %02d "$i").png" 2>/dev/null || true
            case "$st" in
              *ostOnboarding*|*uietPeriod*|"")
                DONE=$((DONE+1)); if [ "$DONE" -ge 2 ]; then echo "tutorial complete -> LIVE"; break; fi; sleep 4; continue;;
            esac
            DONE=0
            # PAYWALL: "I am out of juice" / "HeyClicky Pro" blocks the demo when
            # the account has no credits. Dismiss it (X at top-right of the card)
            # and record it — a funded account won't hit this; an exhausted one
            # can't complete the agent steps regardless.
            case "$Tl" in
              *"out of juice"*|*"heyclicky pro"*|*"get heyclicky"*|*"save 20"*)
                echo "PAYWALL detected (account out of juice) — dismissing"
                cliclick c:733,195 || true; sleep 1
                cliclick c:733,195 || true ;;
            esac
            case "$Tl" in
              *"show me"*|*"let me show"*|*"look around"*)  cliclick c:511,86 || cliclick c:511,143 || true ;;
              *type*|*"text mode"*|*"not in the mood"*)     # TEXT MODE step
                ctrl_double; sleep 1; se_type "Hey Clicky, what is on my screen right now?"; sleep 1; se_return ;;
              *dictat*|*"word-for-word"*|*"word for word"*)  voice_hold ;;      # dictation
              *circle*|*"ask about"*)                       # circle + ask
                voice_hold & VH=$!
                for p in 611,384 587,454 511,484 435,454 411,384 435,314 511,284 587,314 611,384; do cliclick m:$p || true; done
                wait "$VH" 2>/dev/null || true ;;
              *draw*)                                       voice_hold ;;       # draw on screen
              *hold*|*"talk to"*|*"push to talk"*|*"say"*|*hello*|*"your name"*)  voice_hold ;;  # push-to-talk
              *"hear you"*|*mic*|*microphone*|*sound*|*speaker*|*listening*)  : ;;  # audio already flowing
              *"that's it"*|*"all set"*|*"you're all"*|*"youre all"*|*done*|*finish*|*"great"*)  cliclick c:511,86 || cliclick c:511,143 || true ;;
              *) : ;;
            esac
            # Always also nudge the notch CTA (Continue / Next / Got it) to advance.
            notch_continue
            sleep 4
          done
          kill "$AUD" 2>/dev/null || true    # stop the continuous mic feed
          sleep 3
          screencapture -x evidence/shots/live-home.png 2>/dev/null || true
          # ---- FINAL clean text-trigger demonstration (on the live app) -------
          # The guided demo above is done and the app is LIVE. As a clean, isolated
          # capstone, open the composer with the control double-tap (System Events —
          # the only path that fires it), type a message, and send it. (keys.swift
          # is re-created here for the voice-hold sanity check; harmless duplicate.)
          cat > /tmp/keys.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let src = CGEventSource(stateID: .hidSystemState)
          // Post a flagsChanged with the given device-independent flags; `key` is
          // the modifier keycode that changed (0x3B=L-Control, 0x3A=L-Option).
          func flags(_ f: CGEventFlags, _ key: CGKeyCode, _ down: Bool) {
              guard let e = CGEvent(keyboardEventSource: src, virtualKey: key, keyDown: down) else { return }
              e.type = .flagsChanged; e.flags = f
              // Post at the HID tap so the event flows up through the session tap
              // exactly like a real hardware key, matching how the runtime monitor
              // sees hardware Control taps (session-level posting skips that path).
              e.post(tap: .cghidEventTap)
          }
          // One clean Control tap with a given hold (ms): press (flags=control),
          // hold, release (flags=[]).
          func ctrlTap(_ holdMs: UInt32) {
              flags(.maskControl, 0x3B, true); usleep(holdMs * 1000); flags([], 0x3B, false)
          }
          let args = Array(CommandLine.arguments.dropFirst())
          let mode = args.first ?? "double"
          switch mode {
          case "double":                              // control double-tap -> text mode
              // Parametric: `double <holdMs> <gapMs>` (defaults 120/220). The gap is
              // the delay between tap1 release and tap2 press; must be < 0.5s.
              // The runtime monitor (FUN_100a56544) detects tap1's PRESS only when
              // previousDeviceIndependentFlagsAfterFlagsChanged is EMPTY. Post a
              // clean control-up (flags=[]) first to force that empty baseline
              // (harmless: it's not a release unless control was actually down).
              let holdMs = UInt32(args.count > 1 ? args[1] : "") ?? 120
              let gapMs  = UInt32(args.count > 2 ? args[2] : "") ?? 220
              flags([], 0x3B, false); usleep(90_000)   // baseline: previousFlags = empty
              ctrlTap(holdMs); usleep(gapMs * 1000); ctrlTap(holdMs)
          case "hold":                                // control+option hold -> voice listen
              flags(.maskControl, 0x3B, true); usleep(60_000)
              flags([.maskControl, .maskAlternate], 0x3A, true); usleep(3_500_000)
              flags(.maskControl, 0x3A, false); usleep(60_000); flags([], 0x3B, false)
          default: break
          }
          SWIFT
          echo "app state before battery: '$(app_state)'"
          echo "=== persisted textTrigger config at runtime ==="
          python3 - <<'PY' || true
          import plistlib, os
          try:
              d = plistlib.load(open(os.path.expanduser('~/Library/Preferences/com.humansongs.clicky.plist'),'rb'))
              v = d.get('clicky.hotkeys.textTrigger.v1')
              print('textTrigger =', v.decode() if isinstance(v,(bytes,bytearray)) else v)
          except Exception as e: print('read err', e)
          PY
          shot() { screencapture -x "evidence/shots/$1.png" 2>/dev/null || true; }
          shot diag-00-home
          # The app opens System Settings during its permission flow; it steals
          # focus and covers the notch. Quit it and bring HeyClicky forward so the
          # text composer can appear and receive focus.
          osascript -e 'tell application "System Settings" to quit' 2>/dev/null || true
          killall "System Settings" 2>/dev/null || true
          sleep 2
          osascript -e 'tell application "HeyClicky" to activate' 2>/dev/null || true
          sleep 1
          shot diag-00b-settings-closed
          # ---- OPEN the text composer via the control DOUBLE-TAP ---------------
          # SOLVED: CGEventPost-synthesized flagsChanged events satisfy every
          # decompiled precondition but never reach the runtime monitor's tap the
          # way it needs; macOS System Events (osascript) synthesizes the Control
          # key (key code 59) through Apple's trusted automation path, which the
          # monitor sees like real hardware. Two quick `key code 59` = the
          # double-tap that fires textTriggerPressedPublisher -> composer opens
          # (the app logs reason=textInputActive). Retry until the composer is up.
          # The composer auto-closes within ~2s, so do the double-tap, wait for it
          # to appear, then type + Return — ALL in one tight System Events session
          # (no slow log-check or screenshot in between, which is what let it close
          # empty last time). Retry a couple of gaps; capture after each.
          MSG="Hey Clicky, what is on my screen right now?"
          for d in 0.12 0.16 0.2; do
            killall "System Settings" 2>/dev/null || true
            osascript -e 'tell application "HeyClicky" to activate' 2>/dev/null || true
            echo "control double-tap + type + send (System Events), gap=${d}s"
            osascript \
              -e 'tell application "System Events"' \
              -e 'key code 59' -e "delay $d" -e 'key code 59' \
              -e 'delay 0.6' \
              -e "keystroke \"$MSG\"" \
              -e 'delay 0.3' \
              -e 'key code 36' \
              -e 'end tell' 2>/dev/null || true
            sleep 1
            shot "$(printf 'textsend-g%s' "$d")"
            st="$(app_state)"; echo "after attempt gap=$d: state='$st'"
            case "$st" in *textInputActive*|*voiceBusy*) echo "message sent"; break;; esac
            sleep 1
          done
          shot text-02-typed
          # Capture HeyClicky's reply (frames + state logging). Audio (its spoken
          # reply) is recorded via BlackHole in av.mkv.
          for t in $(seq -w 1 12); do
            shot "text-resp-${t}"
            [ $((10#$t % 3)) -eq 0 ] && echo "resp $t state: '$(app_state)'"
            sleep 5
          done
          # Stop the continuous audio feed and the frame-burst recorder, then
          # stitch the frames into an mp4. framerate 3 keeps it watchable.
          kill "$AUD" 2>/dev/null || true
          # Stop the ffmpeg av recorder with SIGINT so it writes a valid mp4.
          kill -INT "$AVVID" 2>/dev/null || true
          sleep 5; kill -9 "$AVVID" 2>/dev/null || true
          ls -la evidence/av.mkv 2>/dev/null; echo "--- av.log ---"; tail -5 evidence/av.log 2>/dev/null || true
          kill "$FULLVID" 2>/dev/null || true
          sleep 1
          NF=$(ls /tmp/frames/f_*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "captured $NF frames"
          run_to 180 ffmpeg -y -framerate 3 -pattern_type glob -i '/tmp/frames/f_*.png' \
            -c:v libx264 -pix_fmt yuv420p -vf scale=1024:-2 -movflags +faststart \
            evidence/fullrun.mp4 2>evidence/ffmpeg.log || echo "ffmpeg stitch failed"
          ls -la evidence/fullrun.mp4 2>/dev/null || true

      - name: Logs
        if: always()
        run: |
          log show --predicate 'subsystem == "com.humansongs.clicky"' --last 6m --info --debug > evidence/oslog.txt 2>&1 || true
          # Dump the app's persisted config to reveal the ACTUAL text-trigger
          # shortcut binding + whether it is enabled (the double-tap fire gate).
          echo "=== defaults read com.humansongs.clicky ===" > evidence/app_defaults.txt
          defaults read com.humansongs.clicky >> evidence/app_defaults.txt 2>&1 || true
          echo "=== hotkey/trigger keys ===" >> evidence/app_defaults.txt
          defaults read com.humansongs.clicky 2>/dev/null | grep -iE "trigger|hotkey|shortcut|doubleTap|voiceHold|control|combo|modifier" >> evidence/app_defaults.txt 2>&1 || true
          echo "=== DECODED hotkey shortcut JSON blobs ===" >> evidence/app_defaults.txt
          python3 - >> evidence/app_defaults.txt 2>&1 <<'PY' || true
          import plistlib, os
          p = os.path.expanduser('~/Library/Preferences/com.humansongs.clicky.plist')
          try:
              d = plistlib.load(open(p, 'rb'))
          except Exception as e:
              print('no plist:', e); raise SystemExit
          for k, v in sorted(d.items()):
              if any(t in k.lower() for t in ('hotkey', 'trigger', 'shortcut', 'voicehold', 'dictation')):
                  print(k, '=>', v.decode('utf-8', 'replace') if isinstance(v, (bytes, bytearray)) else v)
          PY
          echo "=== app support / prefs files ===" >> evidence/app_defaults.txt
          ls -la "$HOME/Library/Application Support/HeyClicky" 2>/dev/null >> evidence/app_defaults.txt || true
          ls -la "$HOME/Library/Application Support/com.humansongs.clicky" 2>/dev/null >> evidence/app_defaults.txt || true
          ls -la "$HOME/Library/Preferences/com.humansongs.clicky.plist" 2>/dev/null >> evidence/app_defaults.txt || true
          pkill -f HeyClicky.app || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-recording
          path: evidence/**
          if-no-files-found: warn
